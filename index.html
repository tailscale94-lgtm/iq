<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إصلاح الشاشة السوداء - نظام 8 كاميرات</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; height: 90vh; }
        @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        .box { 
            background: #111; border: 2px solid #333; border-radius: 8px; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; overflow: hidden; position: relative;
            aspect-ratio: 4/3;
        }
        .box.active { border-color: #00d1b2; }
        video { width: 100%; height: 100%; object-fit: cover; display: none; background: #000; transform: scaleX(-1); }
        .qr-div { background: white; padding: 5px; border-radius: 4px; }
        .info { position: absolute; top: 5px; right: 10px; background: rgba(0,0,0,0.8); padding: 2px 8px; border-radius: 4px; font-size: 11px; z-index: 10; }
        .play-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); display: none; align-items: center; 
            justify-content: center; cursor: pointer; z-index: 20;
        }
        #mobile-ui { display:none; text-align: center; padding: 40px 20px; }
        .btn { background: #00d1b2; color: #000; padding: 20px; border: none; border-radius: 10px; font-size: 1.3rem; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

<div id="pc-ui">
    <div style="text-align:center; padding-bottom:10px;">إذا ظهرت الشاشة سوداء، اضغط على المربع لتشغيل الفيديو</div>
    <div class="grid" id="gridContainer"></div>
</div>

<div id="mobile-ui">
    <h2 id="cam-name">بث الكاميرا الأمامية</h2>
    <button class="btn" id="startBtn">بدء البث المباشر 🤳</button>
    <p id="status">جاهز...</p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');
    const camNo = urlParams.get('cam');

    if (joinId) {
        document.getElementById('pc-ui').style.display = 'none';
        document.getElementById('mobile-ui').style.display = 'block';
        
        const peer = new Peer();
        document.getElementById('startBtn').onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: 640, height: 480 }, 
                    audio: false 
                });
                peer.call(joinId, stream);
                document.getElementById('status').innerText = "✅ متصل بالحاسوب";
                document.getElementById('startBtn').style.opacity = "0.5";
            } catch (e) { alert("خطأ في الكاميرا: " + e); }
        };
    } else {
        const grid = document.getElementById('gridContainer');
        for (let i = 1; i <= 8; i++) {
            const box = document.createElement('div');
            box.className = 'box';
            box.id = `parent-${i}`;
            box.innerHTML = `
                <div class="info">كاميرا ${i}</div>
                <div id="qr${i}" class="qr-div"></div>
                <div id="overlay-${i}" class="play-overlay">▶ اضغط لتشغيل البث</div>
                <video id="v${i}" autoplay playsinline muted></video>
            `;
            grid.appendChild(box);

            const peer = new Peer();
            peer.on('open', (id) => {
                const link = window.location.href.split('?')[0] + `?join=${id}&cam=${i}`;
                new QRCode(document.getElementById(`qr${i}`), { text: link, width: 110, height: 110 });
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (s) => {
                    const video = document.getElementById(`v${i}`);
                    const overlay = document.getElementById(`overlay-${i}`);
                    const qr = document.getElementById(`qr${i}`);
                    
                    qr.style.display = 'none';
                    video.style.display = 'block';
                    overlay.style.display = 'flex'; // إظهار زر التشغيل
                    video.srcObject = s;

                    // عند النقر على المربع، يتم تشغيل الفيديو قسرياً
                    box.onclick = () => {
                        video.play();
                        overlay.style.display = 'none';
                        box.classList.add('active');
                    };
                });
            });
        }
    }
</script>
</body>
</html>
