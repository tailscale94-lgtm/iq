<?php
// جلب عنوان الـ IP المحلي للجهاز تلقائياً
$host_ip = gethostbyname(gethostname());
?>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام 8 كاميرات - PHP Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding: 10px; overflow-x: hidden; }
        h1 { text-align: center; font-size: 1.2rem; color: #00d1b2; margin: 5px 0; }
        
        /* شبكة العرض 4 أعمدة في صفين */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            height: 90vh; 
        }

        .box { 
            background: #1a1a1a; 
            border: 2px solid #333; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .box:hover { border-color: #00d1b2; }

        /* حالة ملء الشاشة عند النقر */
        .box.fullscreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; padding: 0; border: none;
        }

        video { 
            width: 100%; height: 100%; object-fit: cover; 
            display: none; border-radius: 10px; 
        }

        .qr-div { background: white; padding: 8px; border-radius: 8px; }
        
        .label { 
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.7); padding: 2px 10px; 
            border-radius: 20px; font-size: 0.8rem; z-index: 5;
        }

        /* واجهة الهاتف */
        #mobile-ui { display:none; text-align: center; padding: 100px 20px; }
        .btn-stream { 
            background: #00d1b2; color: #000; border: none; 
            padding: 25px 50px; font-size: 1.4rem; border-radius: 50px; 
            font-weight: bold; box-shadow: 0 10px 20px rgba(0,209,178,0.3);
        }
    </style>
</head>
<body>

<div id="pc-ui">
    <h1>لوحة المراقبة الذكية - IP: <?php echo $host_ip; ?></h1>
    <div class="grid" id="gridContainer">
        <?php for($i=1; $i<=8; $i++): ?>
        <div class="box" id="box-<?php echo $i; ?>" onclick="toggleFull(this)">
            <div class="label">كاميرا <?php echo $i; ?></div>
            <div id="qr-<?php echo $i; ?>" class="qr-div"></div>
            <video id="v-<?php echo $i; ?>" autoplay playsinline></video>
        </div>
        <?php endfor; ?>
    </div>
</div>

<div id="mobile-ui">
    <h2 id="cam-info">جاهز للربط بالنافذة رقم...</h2>
    <button class="btn-stream" id="startBtn">فتح الاسماء</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');
    const camNo = urlParams.get('cam');
    const serverIP = "<?php echo $host_ip; ?>";

    // --- وظيفة تكبير النافذة ---
    function toggleFull(el) {
        el.classList.toggle('fullscreen');
    }

    if (joinId) {
        // --- وضع الهاتف ---
        document.getElementById('pc-ui').style.display = 'none';
        document.getElementById('mobile-ui').style.display = 'block';
        document.getElementById('cam-info').innerText = "وزارة الصحة " + camNo;

        const peer = new Peer();
        document.getElementById('startBtn').onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                peer.call(joinId, stream);
                document.getElementById('mobile-ui').innerHTML = "<h3>يتم جلب الاسماء بنجاح الرجاء الانتضار ✅</h3>";
            } catch (e) {
                alert("خطأ: يرجى التأكد من استخدام متصفح يدعم الكاميرا والسماح بالصلاحيات.");
            }
        };
    } else {
        // --- وضع الحاسوب ---
        for (let i = 1; i <= 8; i++) {
            const peer = new Peer();
            peer.on('open', (id) => {
                // إنشاء الرابط باستخدام الـ IP الذي جلبه PHP
                const link = `http://${serverIP}/camera/index.php?join=${id}&cam=${i}`;
                new QRCode(document.getElementById(`qr-${i}`), { 
                    text: link, width: 150, height: 150 
                });
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (s) => {
                    const video = document.getElementById(`v-${i}`);
                    video.srcObject = s;
                    video.style.display = 'block';
                    document.getElementById(`qr-${i}`).style.display = 'none';
                });
            });
        }
    }
</script>
</body>
</html>
