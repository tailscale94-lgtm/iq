<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام 8 كاميرات - النسخة السحابية</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding: 10px; overflow-x: hidden; }
        h1 { text-align: center; font-size: 1.2rem; color: #00d1b2; margin: 5px 0; }
        
        .setup-panel { text-align: center; margin-bottom: 15px; background: #1a1a1a; padding: 10px; border-radius: 10px; }
        input { padding: 8px; border-radius: 5px; border: 1px solid #00d1b2; background: #000; color: #fff; text-align: center; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 10px; 
            min-height: 80vh; 
        }

        .box { 
            background: #1a1a1a; 
            border: 2px solid #333; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative;
            min-height: 200px;
            cursor: pointer;
        }

        .box.fullscreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; padding: 0; border: none;
        }

        video { width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 10px; }
        .qr-div { background: white; padding: 5px; border-radius: 5px; }
        .label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; z-index: 5; }

        #mobile-ui { display:none; text-align: center; padding: 100px 20px; }
        .btn-stream { 
            background: #00d1b2; color: #000; border: none; 
            padding: 25px 50px; font-size: 1.4rem; border-radius: 50px; 
            font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="pc-ui">
    <h1>لوحة المراقبة الذكية</h1>
    <div class="setup-panel" id="setup">
        <label>أدخل رابط الموقع (أو الـ IP): </label>
        <input type="text" id="ipInput" placeholder="مثال: 192.168.1.5" onchange="generateAllQRs()">
        <p style="font-size: 0.8rem; color: #888;">* بعد إدخال الرابط، ستظهر أكواد الـ QR للكاميرات.</p>
    </div>
    <div class="grid" id="gridContainer">
        </div>
</div>

<div id="mobile-ui">
    <h2 id="cam-info">جاهز للربط...</h2>
    <button class="btn-stream" id="startBtn">فتح الكاميرا وبدء البث</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');
    const camNo = urlParams.get('cam');
    const gridContainer = document.getElementById('gridContainer');

    function toggleFull(el) { el.classList.toggle('fullscreen'); }

    if (joinId) {
        // --- وضع الهاتف ---
        document.getElementById('pc-ui').style.display = 'none';
        document.getElementById('mobile-ui').style.display = 'block';
        document.getElementById('cam-info').innerText = "بث كـ كاميرا رقم: " + camNo;

        const peer = new Peer();
        document.getElementById('startBtn').onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                peer.call(joinId, stream);
                document.getElementById('mobile-ui').innerHTML = "<h3>تم الاتصال بنجاح! يتم الآن عرض البث على الشاشة الرئيسية ✅</h3>";
            } catch (e) {
                alert("خطأ: يرجى السماح بصلاحية الكاميرا.");
            }
        };
    } else {
        // --- وضع الحاسوب ---
        for (let i = 1; i <= 8; i++) {
            const box = document.createElement('div');
            box.className = 'box';
            box.id = `box-${i}`;
            box.onclick = function() { toggleFull(this); };
            box.innerHTML = `
                <div class="label">كاميرا ${i}</div>
                <div id="qr-${i}" class="qr-div"></div>
                <video id="v-${i}" autoplay playsinline></video>
            `;
            gridContainer.appendChild(box);

            const peer = new Peer();
            peer.on('open', (id) => {
                box.dataset.peerId = id; // تخزين الـ ID لتوليد الـ QR لاحقاً
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (s) => {
                    const video = document.getElementById(`v-${i}`);
                    video.srcObject = s;
                    video.style.display = 'block';
                    document.getElementById(`qr-${i}`).style.display = 'none';
                });
            });
        }
    }

    function generateAllQRs() {
        const baseUrl = window.location.href.split('?')[0];
        const userIP = document.getElementById('ipInput').value;
        
        for (let i = 1; i <= 8; i++) {
            const qrContainer = document.getElementById(`qr-${i}`);
            qrContainer.innerHTML = ""; // مسح الـ QR القديم
            const peerId = document.getElementById(`box-${i}`).dataset.peerId;
            
            if(peerId && userIP) {
                // إنشاء الرابط بناءً على الـ IP المدخل
                const finalLink = `${baseUrl}?join=${peerId}&cam=${i}`;
                new QRCode(qrContainer, { text: finalLink, width: 120, height: 120 });
            }
        }
    }
</script>
</body>
</html>
