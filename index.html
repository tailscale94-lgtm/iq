<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام التقاط الصور - 8 نوافذ</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding: 10px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; height: 85vh; margin-top: 10px; }
        @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        .box { 
            background: #1a1a1a; border: 2px solid #333; border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; position: relative; aspect-ratio: 4/3; overflow: hidden;
        }
        img { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
        .qr-div { background: white; padding: 8px; border-radius: 8px; }
        .info { position: absolute; top: 8px; right: 10px; background: rgba(0,209,178,0.8); color: #000; padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; z-index: 10; }
        #mobile-ui { display:none; padding: 40px 20px; }
        .btn-capture { background: #e74c3c; color: white; padding: 25px; border: none; border-radius: 50%; width: 100px; height: 100px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(231, 76, 60, 0.5); }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="pc-ui">
    <h2>لوحة استقبال الصور المباشرة</h2>
    <div class="grid" id="gridContainer"></div>
</div>

<div id="mobile-ui">
    <h2 id="cam-name">كاميرا 🤳</h2>
    <p>اضغط على الزر الأحمر لالتقاط صورة وإرسالها للحاسوب</p>
    <button class="btn-capture" id="captureBtn">إرسال 📸</button>
    <video id="preview" autoplay playsinline muted style="width: 100%; max-width: 300px; border-radius: 15px; margin-top: 20px; transform: scaleX(-1); border: 2px solid #333;"></video>
    <canvas id="canvas"></canvas>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');
    const camNo = urlParams.get('cam');

    // إعدادات PeerJS
    const peer = new Peer({
        config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]}
    });

    if (joinId) {
        // --- وضع الهاتف ---
        document.getElementById('pc-ui').style.display = 'none';
        document.getElementById('mobile-ui').style.display = 'block';
        document.getElementById('cam-name').innerText = "ارسال للنافذة " + camNo;

        let localStream;
        const videoPreview = document.getElementById('preview');

        // تشغيل المعاينة فور فتح الصفحة
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                localStream = stream;
                videoPreview.srcObject = stream;
            });

        document.getElementById('captureBtn').onclick = () => {
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            canvas.width = videoPreview.videoWidth;
            canvas.height = videoPreview.videoHeight;
            
            // التقاط الإطار الحالي من الفيديو
            context.drawImage(videoPreview, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.7); // تحويل الصورة لنص (Base64)

            // إرسال البيانات للحاسوب
            const conn = peer.connect(joinId);
            conn.on('open', () => {
                conn.send(imageData);
                alert("تم إرسال الصورة بنجاح ✅");
            });
        };
    } else {
        // --- وضع الحاسوب ---
        const grid = document.getElementById('gridContainer');
        for (let i = 1; i <= 8; i++) {
            const box = document.createElement('div');
            box.className = 'box';
            box.innerHTML = `
                <div class="info">نافذة ${i}</div>
                <div id="qr${i}" class="qr-div"></div>
                <img id="img${i}" src="" />
            `;
            grid.appendChild(box);

            peer.on('open', (id) => {
                const link = window.location.origin + window.location.pathname + `?join=${id}&cam=${i}`;
                new QRCode(document.getElementById(`qr${i}`), { text: link, width: 120, height: 120 });
            });

            // استقبال البيانات (الصورة)
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    const img = document.getElementById(`img${i}`);
                    const qr = document.getElementById(`qr${i}`);
                    img.src = data;
                    img.style.display = 'block';
                    qr.style.display = 'none';
                });
            });
        }
    }
</script>
</body>
</html>
