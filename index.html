<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام 8 كاميرات - XAMPP Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; height: 95vh; }
        .box { 
            background: #111; border: 1px solid #333; border-radius: 8px; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; overflow: hidden; position: relative;
            cursor: pointer; transition: 0.3s;
        }
        /* ميزة التكبير */
        .box.fullscreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999;
        }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .qr-div { background: white; padding: 5px; border-radius: 4px; }
        .info { position: absolute; top: 5px; right: 10px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        
        /* واجهة الجوال */
        #mobile-ui { display:none; text-align: center; padding-top: 50px; }
        .btn { background: #28a745; color: white; padding: 20px; border: none; border-radius: 10px; font-size: 1.5rem; }
    </style>
</head>
<body>

<div id="pc-ui" class="grid" id="gridContainer"></div>

<div id="mobile-ui">
    <h2 id="cam-name"></h2>
    <button class="btn" id="startBtn">تشغيل الكاميرا الآن 🎥</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');
    const camNo = urlParams.get('cam');

    if (joinId) {
        // --- وضع الهاتف ---
        document.getElementById('pc-ui').style.display = 'none';
        document.getElementById('mobile-ui').style.display = 'block';
        document.getElementById('cam-name').innerText = "بث إلى نافذة رقم " + camNo;

        const peer = new Peer();
        document.getElementById('startBtn').onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            peer.call(joinId, stream);
            document.getElementById('mobile-ui').innerHTML = "<h3>يتم البث حالياً... ✅</h3>";
        };
    } else {
        // --- وضع الحاسوب (توليد 8 مربعات) ---
        const grid = document.getElementById('pc-ui');
        for (let i = 1; i <= 8; i++) {
            const box = document.createElement('div');
            box.className = 'box';
            box.innerHTML = `<div class="info">نافذة ${i}</div><div id="qr${i}" class="qr-div"></div><video id="v${i}" autoplay playsinline></video>`;
            box.onclick = () => box.classList.toggle('fullscreen');
            grid.appendChild(box);

            const peer = new Peer();
            peer.on('open', (id) => {
                const myIP = window.location.hostname; // يجلب الـ IP تلقائياً
                const link = `http://${myIP}/camera/index.html?join=${id}&cam=${i}`;
                new QRCode(document.getElementById(`qr${i}`), { text: link, width: 100, height: 100 });
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (s) => {
                    const video = document.getElementById(`v${i}`);
                    video.srcObject = s;
                    video.style.display = 'block';
                    document.getElementById(`qr${i}`).style.display = 'none';
                });
            });
        }
    }
</script>
</body>
</html>
