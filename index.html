<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام 8 كاميرات - نسخة الإصلاح</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; height: 95vh; }
        @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        .box { 
            background: #111; border: 1px solid #333; border-radius: 8px; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; overflow: hidden; position: relative;
            cursor: pointer; aspect-ratio: 4/3;
        }
        .box.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; }
        /* الميزة الأهم: إضافة muted و playsinline */
        video { width: 100%; height: 100%; object-fit: cover; display: none; background: #000; transform: scaleX(-1); }
        .qr-div { background: white; padding: 5px; border-radius: 4px; }
        .info { position: absolute; top: 5px; right: 10px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 12px; z-index: 10; }
        #mobile-ui { display:none; text-align: center; padding: 50px 20px; }
        .btn { background: #007bff; color: white; padding: 20px; border: none; border-radius: 10px; font-size: 1.5rem; width: 100%; max-width: 300px; }
    </style>
</head>
<body>

<div id="pc-ui" class="grid"></div>

<div id="mobile-ui">
    <h2 id="cam-name">جاري الربط...</h2>
    <button class="btn" id="startBtn">إرسال الصورة الآن 🤳</button>
    <p id="status" style="margin-top: 20px; color: #ccc;">تأكد من الموافقة على صلاحية الكاميرا</p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');
    const camNo = urlParams.get('cam');

    if (joinId) {
        document.getElementById('pc-ui').style.display = 'none';
        document.getElementById('mobile-ui').style.display = 'block';
        document.getElementById('cam-name').innerText = "بث للنافذة " + camNo;

        const peer = new Peer();
        document.getElementById('startBtn').onclick = async () => {
            try {
                // نطلب الكاميرا الأمامية
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                const call = peer.call(joinId, stream);
                document.getElementById('startBtn').style.background = "#28a745";
                document.getElementById('startBtn').innerText = "✅ متصل";
                document.getElementById('status').innerText = "البث يعمل الآن على الحاسوب";
            } catch (err) {
                alert("تعذر الوصول للكاميرا: " + err);
            }
        };
    } else {
        const grid = document.getElementById('pc-ui');
        const baseUrl = window.location.href.split('?')[0];

        for (let i = 1; i <= 8; i++) {
            const box = document.createElement('div');
            box.className = 'box';
            // أضفنا muted و playsinline هنا لضمان العمل التلقائي
            box.innerHTML = `<div class="info">نافذة ${i}</div><div id="qr${i}" class="qr-div"></div><video id="v${i}" autoplay playsinline muted></video>`;
            box.onclick = () => box.classList.toggle('fullscreen');
            grid.appendChild(box);

            const peer = new Peer();
            peer.on('open', (id) => {
                const link = `${baseUrl}?join=${id}&cam=${i}`;
                new QRCode(document.getElementById(`qr${i}`), { text: link, width: 120, height: 120 });
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (s) => {
                    const video = document.getElementById(`v${i}`);
                    video.srcObject = s;
                    video.style.display = 'block';
                    document.getElementById(`qr${i}`).style.display = 'none';
                    // محاولة تشغيل الفيديو يدوياً للتأكد
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });
            });
        }
    }
</script>
</body>
</html>
