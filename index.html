<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التقاط صور فوري - 8 نوافذ</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #050505; color: #fff; margin: 0; padding: 10px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; height: 85vh; margin-top: 10px; }
        @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        .box { 
            background: #111; border: 2px solid #333; border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; position: relative; aspect-ratio: 4/3; overflow: hidden;
        }
        canvas { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
        .qr-div { background: white; padding: 5px; border-radius: 5px; }
        .info { position: absolute; top: 8px; right: 10px; background: #00d1b2; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; z-index: 10; }
        #mobile-ui { display:none; padding: 30px 15px; }
        .btn-capture { 
            background: #ff4757; color: white; border: none; width: 120px; height: 120px; 
            border-radius: 50%; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4); margin-bottom: 20px;
        }
        #video-preview { width: 100%; max-width: 320px; border-radius: 15px; transform: scaleX(-1); border: 2px solid #00d1b2; }
    </style>
</head>
<body>

<div id="pc-ui">
    <h2 style="color: #00d1b2;">لوحة استقبال الصور المباشرة</h2>
    <div class="grid" id="gridContainer"></div>
</div>

<div id="mobile-ui">
    <video id="video-preview" autoplay playsinline muted></video>
    <br><br>
    <button class="btn-capture" id="captureBtn">التقاط 📸</button>
    <p>سيتم تحديث الصورة في الحاسوب فوراً</p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');
    const camNo = urlParams.get('cam');

    // إعدادات السيرفرات لضمان العمل خارج الشبكة
    const peerConfig = {
        config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]}
    };

    if (joinId) {
        // --- وضع الهاتف ---
        document.getElementById('pc-ui').style.display = 'none';
        document.getElementById('mobile-ui').style.display = 'block';

        const peer = new Peer(peerConfig);
        let currentStream;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                currentStream = stream;
                document.getElementById('video-preview').srcObject = stream;
            });

        document.getElementById('captureBtn').onclick = () => {
            // نستخدم ميزة PeerJS لإرسال البيانات كـ "اتصال بيانات"
            const conn = peer.connect(joinId);
            conn.on('open', () => {
                const canvas = document.createElement('canvas');
                const video = document.getElementById('video-preview');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const imgData = canvas.toDataURL('image/jpeg', 0.5); // ضغط الصورة لسرعة الإرسال
                conn.send(imgData);
                
                document.getElementById('captureBtn').innerText = "تم ✅";
                setTimeout(() => document.getElementById('captureBtn').innerText = "التقاط 📸", 1000);
            });
        };
    } else {
        // --- وضع الحاسوب ---
        const grid = document.getElementById('gridContainer');
        for (let i = 1; i <= 8; i++) {
            const box = document.createElement('div');
            box.className = 'box';
            box.innerHTML = `
                <div class="info">نافذة ${i}</div>
                <div id="qr${i}" class="qr-div"></div>
                <canvas id="canv${i}"></canvas>
            `;
            grid.appendChild(box);

            const peer = new Peer(peerConfig);
            peer.on('open', (id) => {
                const link = window.location.origin + window.location.pathname + `?join=${id}&cam=${i}`;
                new QRCode(document.getElementById(`qr${i}`), { text: link, width: 120, height: 120 });
            });

            // استقبال البيانات (الصورة) وعرضها فوراً
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    const canvas = document.getElementById(`canv${i}`);
                    const qr = document.getElementById(`qr${i}`);
                    const ctx = canvas.getContext('2d');
                    
                    const img = new Image();
                    img.onload = function() {
                        canvas.style.display = 'block';
                        qr.style.display = 'none';
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                    };
                    img.src = data;
                });
            });
        }
    }
</script>
</body>
</html>
