<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المراقبة الذكي</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --main-color: #00d1b2; --bg-dark: #0a0a0a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: #fff; margin: 0; padding: 10px; }
        h1 { text-align: center; color: var(--main-color); margin-bottom: 20px; font-size: 1.5rem; }
        
        /* تصميم الشبكة */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            max-width: 1200px; margin: 0 auto;
        }

        .box { 
            background: #1a1a1a; border: 2px solid #333; border-radius: 15px; 
            aspect-ratio: 16/9; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; position: relative; overflow: hidden;
        }

        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .qr-container { background: white; padding: 10px; border-radius: 10px; display: block; }
        
        .label { 
            position: absolute; top: 8px; right: 8px; 
            background: rgba(0,0,0,0.6); padding: 2px 12px; 
            border-radius: 10px; font-size: 0.7rem; color: var(--main-color);
        }

        /* واجهة الهاتف */
        #mobile-view { display: none; text-align: center; padding-top: 50px; }
        .btn-start { 
            background: var(--main-color); border: none; padding: 20px 40px; 
            border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 209, 178, 0.4);
        }

        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<div id="pc-view">
    <h1><span style="color:white">📡</span> لوحة التحكم بالكاميرات</h1>
    <div class="grid" id="mainGrid"></div>
</div>

<div id="mobile-view">
    <h2 id="camName">جاري الاتصال...</h2>
    <div style="margin: 30px 0;">📷</div>
    <button class="btn-start" id="btnConnect">بدء بث الكاميرا الآن</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinID = urlParams.get('join');
    const camIndex = urlParams.get('cam');

    // تحديد ما إذا كان المستخدم يفتح الرابط من الباركود (هاتف) أو المتصفح العادي
    if (joinID) {
        showMobileUI();
    } else {
        showPCUI();
    }

    function showPCUI() {
        const grid = document.getElementById('mainGrid');
        const currentUrl = window.location.href.split('?')[0];

        for (let i = 1; i <= 8; i++) {
            const peer = new Peer();
            const box = document.createElement('div');
            box.className = 'box';
            box.innerHTML = `
                <div class="label">كاميرا ${i}</div>
                <div id="qr-${i}" class="qr-container"></div>
                <video id="v-${i}" autoplay playsinline muted></video>
            `;
            grid.appendChild(box);

            peer.on('open', (id) => {
                // توليد الباركود برابط يحتوي على معرف الـ Peer الخاص بكل كاميرا
                new QRCode(document.getElementById(`qr-${i}`), {
                    text: `${currentUrl}?join=${id}&cam=${i}`,
                    width: 120, height: 120
                });
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (stream) => {
                    const video = document.getElementById(`v-${i}`);
                    video.srcObject = stream;
                    video.style.display = 'block';
                    document.getElementById(`qr-${i}`).style.display = 'none';
                });
            });
        }
    }

    function showMobileUI() {
        document.getElementById('pc-view').style.display = 'none';
        document.getElementById('mobile-view').style.display = 'block';
        document.getElementById('camName').innerText = "بث كاميرا رقم " + camIndex;

        const peer = new Peer();
        
        document.getElementById('btnConnect').onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, // استخدام الكاميرا الخلفية
                    audio: false 
                });
                
                peer.call(joinID, stream);
                document.getElementById('mobile-view').innerHTML = `
                    <div style="color:var(--main-color); font-size: 5rem;">✅</div>
                    <h2>تم الاتصال!</h2>
                    <p>يتم الآن عرض الكاميرا على الشاشة الرئيسية.</p>
                `;
            } catch (err) {
                alert("خطأ: يرجى تفعيل صلاحية الكاميرا في المتصفح.");
            }
        };
    }
</script>
</body>
</html>
